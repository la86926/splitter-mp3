<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Splitter MP3</title>
<style>html,body{margin:0;min-height:100%;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:pan-y}#loader{min-height:100vh;display:grid;place-items:center;color:#6e6e73;font-size:14px}</style>
</head>
<body>
<div id="loader">Abriendo Splitter MP3…</div>
<script>
(async function(){
  const response=await fetch('./splitter-app.html?v=20260731-wavezoom5',{cache:'no-store'});
  if(!response.ok)throw new Error('No se pudo cargar la aplicación original.');
  let source=await response.text();

  source=source.replace(
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
    '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">'
  );

  const old=`  /* ---- Interacción sobre la onda: toque = ubicar cursor; zoom desactivado ---- */
  canvas.addEventListener('pointerdown', e => {
    if (!duration || !e.isPrimary) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    const startX = e.clientX;
    let moved = false;

    const move = ev => {
      if (Math.abs(ev.clientX - startX) > 4) moved = true;
    };
    const up = ev => {
      canvas.releasePointerCapture(e.pointerId);
      canvas.removeEventListener('pointermove', move);
      canvas.removeEventListener('pointerup', up);
      canvas.removeEventListener('pointercancel', up);
      if (!moved && ev.type === 'pointerup') seekTo(timeAtClientX(ev.clientX));
    };

    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
  });

  // Bloquea únicamente el pellizco del trackpad sobre la onda; el desplazamiento normal sigue disponible.
  waveBox.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) e.preventDefault();
  }, { passive:false });`;

  const replacement=`  /* ---- Zoom y navegación de la onda ---- */
  const waveTouches=new Map();
  let waveMode='idle';
  let oneStartX=0,oneLastX=0,oneMoved=false;
  let pinchDistance0=0,pinchSpan0=0,pinchAnchor=0;
  const MIN_WAVE_SPAN=.2;

  function setWaveWindow(a,span){
    span=clamp(span,Math.min(MIN_WAVE_SPAN,duration),duration);
    a=clamp(a,0,Math.max(0,duration-span));
    viewA=a;viewB=a+span;scheduleWave();
  }
  function zoomAt(clientX,factor){
    if(!duration||!isFinite(factor)||factor<=0)return;
    const r=waveBox.getBoundingClientRect();
    const ratio=clamp((clientX-r.left)/Math.max(1,r.width),0,1);
    const oldSpan=viewSpan();
    const newSpan=clamp(oldSpan*factor,Math.min(MIN_WAVE_SPAN,duration),duration);
    const anchor=viewA+ratio*oldSpan;
    setWaveWindow(anchor-ratio*newSpan,newSpan);
  }
  function pair(){return [...waveTouches.values()].slice(0,2)}
  function pairDistance(){const p=pair();return p.length<2?0:Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y)}
  function pairMidX(){const p=pair();return p.length<2?0:(p[0].x+p[1].x)/2}

  canvas.addEventListener('pointerdown',e=>{
    if(!duration)return;
    if(e.pointerType==='touch'){
      e.preventDefault();e.stopImmediatePropagation();
      waveTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});
      try{canvas.setPointerCapture(e.pointerId)}catch(_){}
      if(waveTouches.size===1){
        waveMode='one';oneStartX=oneLastX=e.clientX;oneMoved=false;
      }else if(waveTouches.size===2){
        waveMode='pinch';oneMoved=true;
        pinchDistance0=Math.max(1,pairDistance());
        pinchSpan0=viewSpan();
        pinchAnchor=timeAtClientX(pairMidX());
      }
      return;
    }
    if(!e.isPrimary)return;
    e.preventDefault();
    const start=e.clientX;let moved=false;
    try{canvas.setPointerCapture(e.pointerId)}catch(_){}
    const move=ev=>{if(Math.abs(ev.clientX-start)>4)moved=true};
    const up=ev=>{
      try{canvas.releasePointerCapture(e.pointerId)}catch(_){}
      canvas.removeEventListener('pointermove',move);
      canvas.removeEventListener('pointerup',up);
      canvas.removeEventListener('pointercancel',up);
      if(!moved&&ev.type==='pointerup')seekTo(timeAtClientX(ev.clientX));
    };
    canvas.addEventListener('pointermove',move);
    canvas.addEventListener('pointerup',up);
    canvas.addEventListener('pointercancel',up);
  },true);

  canvas.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch'||!waveTouches.has(e.pointerId))return;
    e.preventDefault();e.stopImmediatePropagation();
    const p=waveTouches.get(e.pointerId);p.x=e.clientX;p.y=e.clientY;
    if(waveMode==='pinch'&&waveTouches.size>=2){
      const d=Math.max(1,pairDistance());
      const mid=pairMidX();
      const r=waveBox.getBoundingClientRect();
      const ratio=clamp((mid-r.left)/Math.max(1,r.width),0,1);
      const span=clamp(pinchSpan0*pinchDistance0/d,Math.min(MIN_WAVE_SPAN,duration),duration);
      setWaveWindow(pinchAnchor-ratio*span,span);
      return;
    }
    if(waveMode==='one'&&waveTouches.size===1){
      const dx=e.clientX-oneLastX;
      if(Math.abs(e.clientX-oneStartX)>5)oneMoved=true;
      if(oneMoved&&viewSpan()<duration){
        const span=viewSpan();
        const r=waveBox.getBoundingClientRect();
        setWaveWindow(viewA-dx/Math.max(1,r.width)*span,span);
      }
      oneLastX=e.clientX;
    }
  },true);

  function endWaveTouch(e){
    if(e.pointerType!=='touch'||!waveTouches.has(e.pointerId))return;
    e.preventDefault();e.stopImmediatePropagation();
    const wasSingle=waveTouches.size===1;
    waveTouches.delete(e.pointerId);
    try{canvas.releasePointerCapture(e.pointerId)}catch(_){}
    if(wasSingle&&!oneMoved&&e.type==='pointerup')seekTo(timeAtClientX(e.clientX));
    if(waveTouches.size===1){
      const p=[...waveTouches.values()][0];
      waveMode='one';oneStartX=oneLastX=p.x;oneMoved=true;
    }else if(waveTouches.size===0){waveMode='idle';oneMoved=false}
  }
  canvas.addEventListener('pointerup',endWaveTouch,true);
  canvas.addEventListener('pointercancel',endWaveTouch,true);

  waveBox.addEventListener('wheel',e=>{
    if(!duration)return;
    e.preventDefault();e.stopPropagation();
    zoomAt(e.clientX,Math.exp(e.deltaY*((e.ctrlKey||e.metaKey)?.007:.0024)));
  },{passive:false});`;

  if(!source.includes(old))throw new Error('No se encontró el bloque original de la onda.');
  source=source.replace(old,replacement);

  source=source.replace('</style>',`\nhtml,body{touch-action:pan-y;overscroll-behavior:none} .wave-box,#waveCanvas{touch-action:none!important}.editor-tools{display:flex;justify-content:center;gap:8px;margin:14px 0 2px}.editor-tool{width:42px;height:42px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center}.editor-tool:active{transform:scale(.95)}.editor-tool:disabled{opacity:.35}.editor-tool.danger{color:#d34b3f}.editor-tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n</style>`);

  source=source.replace('</body>',`<script>\n(function(){\n  document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});\n  document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});\n  document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});\n  let lastTouchEnd=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<320)e.preventDefault();lastTouchEnd=now},{passive:false});\n\n  const transport=document.querySelector('.transport');if(!transport)return;\n  const tools=document.createElement('div');tools.className='editor-tools';tools.innerHTML='\\
  <button class="editor-tool" id="editUndo" title="Atrás" aria-label="Atrás"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h9a6 6 0 0 1 6 6"/></svg></button>\\
  <button class="editor-tool" id="editRedo" title="Adelante" aria-label="Adelante"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M20 12h-9a6 6 0 0 0-6 6"/></svg></button>\\
  <button class="editor-tool" id="editCut" title="Recortar en el cursor" aria-label="Recortar en el cursor"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="m8.7 8.4 10.3 6.2M8.7 15.6 19 9.4"/></svg></button>\\
  <button class="editor-tool danger" id="editDelete" title="Limpiar recorte" aria-label="Limpiar recorte"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></button>';\n  transport.insertAdjacentElement('afterend',tools);\n\n  const undo=[],redo=[];let applying=false;\n  const snapshot=()=>[selStart,selEnd];\n  const equal=(a,b)=>a&&b&&Math.abs(a[0]-b[0])<.001&&Math.abs(a[1]-b[1])<.001;\n  function record(){const s=snapshot();if(!equal(undo[undo.length-1],s)){undo.push(s);if(undo.length>50)undo.shift();redo.length=0}refresh()}\n  function apply(s){if(!s)return;applying=true;setSelection(s[0],s[1],'history');applying=false;refresh()}\n  function refresh(){editUndo.disabled=undo.length<2;editRedo.disabled=!redo.length}\n  setTimeout(record,0);\n  waveBox.addEventListener('pointerup',()=>{if(!applying)setTimeout(record,0)},true);\n  editUndo.onclick=()=>{if(undo.length<2)return;redo.push(undo.pop());apply(undo[undo.length-1])};\n  editRedo.onclick=()=>{if(!redo.length)return;const s=redo.pop();undo.push(s);apply(s)};\n  editCut.onclick=()=>{\n    if(!duration)return;\n    const t=clamp(Number(audio.currentTime)||0,0,duration);\n    if(t<=selStart+.01||t>=selEnd-.01)return;\n    record();\n    const leftDistance=t-selStart,rightDistance=selEnd-t;\n    if(leftDistance<=rightDistance)setSelection(t,selEnd,'scissors');\n    else setSelection(selStart,t,'scissors');\n    record();\n  };\n  editDelete.onclick=()=>{if(!duration)return;record();setSelection(0,duration,'clear');record()};\n  refresh();\n})();\n<\/script>\n</body>`);

  document.open();document.write(source);document.close();
})().catch(error=>{console.error(error);const loader=document.getElementById('loader');if(loader)loader.textContent='No se pudo abrir Splitter MP3. Recarga la página.'});
</script>
</body>
</html>
