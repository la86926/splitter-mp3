<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splitter MP3</title>
<style>
  html,body{margin:0;min-height:100%;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #loader{min-height:100vh;display:grid;place-items:center;color:#6e6e73;font-size:14px}
</style>
</head>
<body>
<div id="loader">Abriendo Splitter MP3…</div>
<script>
(async function(){
  const response = await fetch('./splitter-app.html?v=20260731-zoom', { cache:'no-store' });
  if (!response.ok) throw new Error('No se pudo cargar la aplicación original.');
  const source = await response.text();

  const oldBlock = `  /* ---- Interacción sobre la onda: toque = ubicar cursor; zoom desactivado ---- */
  canvas.addEventListener('pointerdown', e => {
    if (!duration || !e.isPrimary) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    const startX = e.clientX;
    let moved = false;

    const move = ev => {
      if (Math.abs(ev.clientX - startX) > 4) moved = true;
    };
    const up = ev => {
      canvas.releasePointerCapture(e.pointerId);
      canvas.removeEventListener('pointermove', move);
      canvas.removeEventListener('pointerup', up);
      canvas.removeEventListener('pointercancel', up);
      if (!moved && ev.type === 'pointerup') seekTo(timeAtClientX(ev.clientX));
    };

    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
  });

  // Bloquea únicamente el pellizco del trackpad sobre la onda; el desplazamiento normal sigue disponible.
  waveBox.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) e.preventDefault();
  }, { passive:false });`;

  const zoomBlock = `  /* ---- Interacción sobre la onda: toque para ubicar cursor y zoom gestual ---- */
  const zoomPointers = new Map();
  let pinchActive = false;
  let pinchStartDistance = 0;
  let pinchStartSpan = 0;
  let pinchAnchorTime = 0;
  const MIN_VIEW_SPAN = 0.25;

  function zoomWave(factor, clientX){
    if (!duration || !isFinite(factor) || factor <= 0) return;
    const r = waveBox.getBoundingClientRect();
    const ratio = clamp((clientX - r.left) / Math.max(1, r.width), 0, 1);
    const oldSpan = viewSpan();
    const minSpan = Math.min(MIN_VIEW_SPAN, duration);
    const newSpan = clamp(oldSpan * factor, minSpan, duration);
    const anchorTime = viewA + ratio * oldSpan;
    let nextA = anchorTime - ratio * newSpan;
    nextA = clamp(nextA, 0, Math.max(0, duration - newSpan));
    viewA = nextA;
    viewB = nextA + newSpan;
    scheduleWave();
  }

  canvas.addEventListener('pointerdown', e => {
    if (!duration || !e.isPrimary) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    const startX = e.clientX;
    let moved = false;

    const move = ev => {
      if (Math.abs(ev.clientX - startX) > 4) moved = true;
    };
    const up = ev => {
      try { canvas.releasePointerCapture(e.pointerId); } catch(_){}
      canvas.removeEventListener('pointermove', move);
      canvas.removeEventListener('pointerup', up);
      canvas.removeEventListener('pointercancel', up);
      if (!moved && ev.type === 'pointerup') seekTo(timeAtClientX(ev.clientX));
    };

    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
  });

  function pointerDistance(){
    const pts = [...zoomPointers.values()];
    if (pts.length < 2) return 0;
    return Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
  }
  function pointerMidX(){
    const pts = [...zoomPointers.values()];
    return pts.length < 2 ? 0 : (pts[0].x + pts[1].x) / 2;
  }

  waveBox.addEventListener('pointerdown', e => {
    if (!duration || e.pointerType !== 'touch') return;
    zoomPointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (zoomPointers.size === 2){
      pinchActive = true;
      pinchStartDistance = Math.max(1, pointerDistance());
      pinchStartSpan = viewSpan();
      pinchAnchorTime = timeAtClientX(pointerMidX());
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  waveBox.addEventListener('pointermove', e => {
    const point = zoomPointers.get(e.pointerId);
    if (!point) return;
    point.x = e.clientX;
    point.y = e.clientY;
    if (!pinchActive || zoomPointers.size < 2) return;

    e.preventDefault();
    e.stopPropagation();
    const distance = Math.max(1, pointerDistance());
    const midpoint = pointerMidX();
    const r = waveBox.getBoundingClientRect();
    const ratio = clamp((midpoint - r.left) / Math.max(1, r.width), 0, 1);
    const minSpan = Math.min(MIN_VIEW_SPAN, duration);
    const newSpan = clamp(pinchStartSpan * pinchStartDistance / distance, minSpan, duration);
    let nextA = pinchAnchorTime - ratio * newSpan;
    nextA = clamp(nextA, 0, Math.max(0, duration - newSpan));
    viewA = nextA;
    viewB = nextA + newSpan;
    scheduleWave();
  }, true);

  function endZoomPointer(e){
    if (!zoomPointers.has(e.pointerId)) return;
    if (pinchActive){
      e.preventDefault();
      e.stopPropagation();
    }
    zoomPointers.delete(e.pointerId);
    if (zoomPointers.size === 0){
      pinchActive = false;
      pinchStartDistance = 0;
      pinchStartSpan = 0;
    }
  }
  waveBox.addEventListener('pointerup', endZoomPointer, true);
  waveBox.addEventListener('pointercancel', endZoomPointer, true);

  // Rueda del mouse o pellizco del trackpad: arriba acerca y abajo aleja.
  waveBox.addEventListener('wheel', e => {
    if (!duration) return;
    e.preventDefault();
    const intensity = (e.ctrlKey || e.metaKey) ? 0.008 : 0.0025;
    zoomWave(Math.exp(e.deltaY * intensity), e.clientX);
  }, { passive:false });`;

  if (!source.includes(oldBlock)) throw new Error('No se encontró la sección de la onda que debía actualizarse.');
  const patched = source.replace(oldBlock, zoomBlock);
  document.open();
  document.write(patched);
  document.close();
})().catch(function(error){
  console.error(error);
  const loader = document.getElementById('loader');
  if (loader) loader.textContent = 'No se pudo abrir Splitter MP3. Recarga la página.';
});
</script>
</body>
</html>
