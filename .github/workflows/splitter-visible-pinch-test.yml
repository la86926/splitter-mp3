name: Splitter visible pinch test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/splitter-visible-pinch-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Generate WAV sample
        run: |
          node <<'NODE'
          const fs=require('fs');
          const rate=44100,seconds=5,frames=rate*seconds,dataSize=frames*2;
          const b=Buffer.alloc(44+dataSize);
          b.write('RIFF',0);b.writeUInt32LE(36+dataSize,4);b.write('WAVE',8);
          b.write('fmt ',12);b.writeUInt32LE(16,16);b.writeUInt16LE(1,20);
          b.writeUInt16LE(1,22);b.writeUInt32LE(rate,24);b.writeUInt32LE(rate*2,28);
          b.writeUInt16LE(2,32);b.writeUInt16LE(16,34);b.write('data',36);b.writeUInt32LE(dataSize,40);
          for(let i=0;i<frames;i++)b.writeInt16LE(Math.round(Math.sin(2*Math.PI*440*i/rate)*12000),44+i*2);
          fs.writeFileSync('sample.wav',b);
          NODE

      - name: Test visible selection gestures
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          cat > test.js <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1100,height:900},hasTouch:true});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>console.log('BROWSER:',m.type(),m.text()));
            await page.goto('http://127.0.0.1:4173/?test=visible-pinch',{waitUntil:'networkidle'});
            await page.waitForSelector('#fileCut',{state:'attached',timeout:30000});
            await page.setInputFiles('#fileCut','sample.wav');
            await page.waitForSelector('#editor:not([hidden])',{timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#roEnd')?.textContent!=='0:00.0');

            if(await page.locator('footer').count())throw Error('El pie eliminado volvió a aparecer');
            const viewport=await page.locator('meta[name="viewport"]').getAttribute('content');
            if(!viewport.includes('maximum-scale=1')||!viewport.includes('user-scalable=no'))throw Error('Zoom global no bloqueado');

            const selection=page.locator('#selFrame');
            let s=await selection.boundingBox();
            await page.mouse.click(s.x+s.width*.35,s.y+s.height*.5);
            const before=await page.locator('#roStart').textContent()+'|'+await page.locator('#roEnd').textContent();
            await page.locator('#editCut').click();
            const afterCut=await page.locator('#roStart').textContent()+'|'+await page.locator('#roEnd').textContent();
            if(afterCut===before)throw Error('Las tijeras no recortaron en el cursor');

            const beforeWheel=await page.locator('#rulerStart').textContent()+'|'+await page.locator('#rulerEnd').textContent();
            const wave=await page.locator('#waveBox').boundingBox();
            s=await selection.boundingBox();
            const left=Math.max(wave.x+18,s.x+18);
            const right=Math.min(wave.x+wave.width-18,s.x+s.width-18);
            const wheelX=(left+right)/2;
            const y=wave.y+wave.height*.5;
            await page.mouse.move(wheelX,y);
            await page.mouse.wheel(0,-500);
            await page.waitForTimeout(400);
            const afterWheel=await page.locator('#rulerStart').textContent()+'|'+await page.locator('#rulerEnd').textContent();
            if(afterWheel===beforeWheel)throw Error('La rueda no amplió la selección');

            const wave2=await page.locator('#waveBox').boundingBox();
            const sel2=await selection.boundingBox();
            const visLeft=Math.max(wave2.x+24,sel2.x+24);
            const visRight=Math.min(wave2.x+wave2.width-24,sel2.x+sel2.width-24);
            if(visRight-visLeft<80)throw Error('No existe suficiente selección visible para probar el pellizco');
            const x1=visLeft+(visRight-visLeft)*.38;
            const x2=visLeft+(visRight-visLeft)*.62;
            const py=wave2.y+wave2.height*.5;
            await page.evaluate(()=>{
              window.__gestureEvents=[];
              ['pointerdown','pointermove','pointerup','touchstart','touchmove','touchend'].forEach(type=>
                document.addEventListener(type,e=>window.__gestureEvents.push(type+':'+(e.pointerType||'touch')),true));
            });
            const client=await context.newCDPSession(page);
            await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:x1,y:py},{x:x2,y:py}]});
            await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:x1-55,y:py},{x:x2+55,y:py}]});
            await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            await page.waitForTimeout(500);
            const afterPinch=await page.locator('#rulerStart').textContent()+'|'+await page.locator('#rulerEnd').textContent();
            const events=await page.evaluate(()=>window.__gestureEvents);
            console.log('GESTURES',JSON.stringify(events));
            if(afterPinch===afterWheel)throw Error('El pellizco visible no amplió la onda');
            if(errors.length)throw Error(errors.join(' | '));
            console.log(JSON.stringify({before,afterCut,beforeWheel,afterWheel,afterPinch}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node test.js

      - name: Save result
        if: always()
        env:
          TEST_STATUS: ${{ job.status }}
        run: |
          printf '{"status":"%s","commit":"%s","run_id":"%s"}\n' "$TEST_STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" > splitter-visible-test-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add splitter-visible-test-status.json
          git commit -m "Registrar prueba visible de Splitter MP3 [skip ci]" || exit 0
          git push
