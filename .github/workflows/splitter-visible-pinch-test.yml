name: Splitter final gesture verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/splitter-visible-pinch-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mark workflow start
        run: |
          printf '{"status":"running","commit":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > splitter-verified-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add splitter-verified-status.json
          git commit -m "Iniciar verificación final de Splitter MP3 [skip ci]"
          git push

      - name: Instrument exact zoom state
        run: python3 scripts/instrument_exact_zoom.py

      - name: Install Chromium
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Verify requested behavior
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          node tests/verify_splitter_gestures.js

      - name: Publish verified application
        run: |
          git add index.html splitter-app.html
          git commit -m "Publicar gestos y tijeras verificados en Splitter MP3"
          git pull --rebase origin main
          git push

      - name: Save success
        run: |
          printf '{"status":"success","commit":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > splitter-verified-status.json
          git add splitter-verified-status.json
          git commit -m "Registrar éxito de Splitter MP3 [skip ci]"
          git pull --rebase origin main
          git push

      - name: Save failure
        if: failure()
        run: |
          printf '{"status":"failure","commit":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > splitter-verified-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add splitter-verified-status.json
          git commit -m "Registrar fallo de Splitter MP3 [skip ci]" || exit 0
          git pull --rebase origin main
          git push
