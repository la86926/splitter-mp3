name: Apply waveform zoom

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-waveform-zoom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pinch and mouse-wheel zoom
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = """  /* ---- Interacción sobre la onda: toque = ubicar cursor; zoom desactivado ---- */
  canvas.addEventListener('pointerdown', e => {
    if (!duration || !e.isPrimary) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    const startX = e.clientX;
    let moved = false;

    const move = ev => {
      if (Math.abs(ev.clientX - startX) > 4) moved = true;
    };
    const up = ev => {
      canvas.releasePointerCapture(e.pointerId);
      canvas.removeEventListener('pointermove', move);
      canvas.removeEventListener('pointerup', up);
      canvas.removeEventListener('pointercancel', up);
      if (!moved && ev.type === 'pointerup') seekTo(timeAtClientX(ev.clientX));
    };

    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
  });

  // Bloquea únicamente el pellizco del trackpad sobre la onda; el desplazamiento normal sigue disponible.
  waveBox.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) e.preventDefault();
  }, { passive:false });
"""
          new = """  /* ---- Interacción sobre la onda: toque para ubicar cursor y zoom gestual ---- */
  const activeWavePointers = new Map();
  let pinchStartDistance = 0, pinchStartSpan = 0, pinchAnchorTime = 0;
  const MIN_VIEW_SPAN = 0.25;

  function zoomWave(factor, clientX){
    if (!duration || !isFinite(factor) || factor <= 0) return;
    const r = waveBox.getBoundingClientRect();
    const ratio = clamp((clientX - r.left) / Math.max(1, r.width), 0, 1);
    const oldSpan = viewSpan();
    const newSpan = clamp(oldSpan * factor, Math.min(MIN_VIEW_SPAN, duration), duration);
    const anchor = viewA + ratio * oldSpan;
    let a = anchor - ratio * newSpan;
    a = clamp(a, 0, Math.max(0, duration - newSpan));
    viewA = a;
    viewB = a + newSpan;
    scheduleWave();
  }

  canvas.addEventListener('pointerdown', e => {
    if (!duration) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    activeWavePointers.set(e.pointerId, { x:e.clientX, y:e.clientY, startX:e.clientX });

    if (activeWavePointers.size === 2){
      const pts = [...activeWavePointers.values()];
      pinchStartDistance = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      pinchStartSpan = viewSpan();
      pinchAnchorTime = timeAtClientX((pts[0].x + pts[1].x) / 2);
    }
  });

  canvas.addEventListener('pointermove', e => {
    const p = activeWavePointers.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;

    if (activeWavePointers.size === 2 && pinchStartDistance > 0){
      const pts = [...activeWavePointers.values()];
      const distance = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      const midpoint = (pts[0].x + pts[1].x) / 2;
      const r = waveBox.getBoundingClientRect();
      const ratio = clamp((midpoint - r.left) / Math.max(1, r.width), 0, 1);
      const newSpan = clamp(pinchStartSpan * pinchStartDistance / Math.max(1, distance), Math.min(MIN_VIEW_SPAN, duration), duration);
      let a = pinchAnchorTime - ratio * newSpan;
      a = clamp(a, 0, Math.max(0, duration - newSpan));
      viewA = a; viewB = a + newSpan;
      scheduleWave();
    }
  });

  function finishWavePointer(e){
    const p = activeWavePointers.get(e.pointerId);
    if (!p) return;
    const wasPinching = activeWavePointers.size > 1 || pinchStartDistance > 0;
    const moved = Math.abs(e.clientX - p.startX) > 4;
    activeWavePointers.delete(e.pointerId);
    try { canvas.releasePointerCapture(e.pointerId); } catch(_){}
    if (activeWavePointers.size < 2){ pinchStartDistance = 0; pinchStartSpan = 0; }
    if (!wasPinching && !moved && e.type === 'pointerup') seekTo(timeAtClientX(e.clientX));
  }
  canvas.addEventListener('pointerup', finishWavePointer);
  canvas.addEventListener('pointercancel', finishWavePointer);

  // Rueda del mouse o pellizco del trackpad: arriba/acercar, abajo/alejar.
  waveBox.addEventListener('wheel', e => {
    if (!duration) return;
    e.preventDefault();
    const intensity = (e.ctrlKey || e.metaKey) ? 0.008 : 0.0025;
    zoomWave(Math.exp(e.deltaY * intensity), e.clientX);
  }, { passive:false });
"""
          if old not in text:
              raise SystemExit('No se encontró el bloque exacto que debía reemplazarse.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit only the requested change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-waveform-zoom.yml
          git add index.html
          git commit -m "Añadir zoom gestual a la onda de audio"
          git push

# Trigger de aplicación
