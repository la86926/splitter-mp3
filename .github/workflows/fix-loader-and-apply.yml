name: Fix Splitter loader and apply patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-loader-and-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix loader source and regenerate app
        run: |
          python3 <<'PY'
          from pathlib import Path
          script=Path('scripts/apply_splitter_patch.py')
          text=script.read_text(encoding='utf-8')
          text=text.replace(r'<\/script>', '</script>')
          script.write_text(text,encoding='utf-8')
          PY
          python3 scripts/apply_splitter_patch.py

      - name: Verify real files
        run: |
          grep -q 'SPLITTER_NATIVE_INTERACTION_V3' splitter-app.html
          grep -q 'waveTouchPointers' splitter-app.html
          grep -q '</script>' index.html
          ! grep -q '<\\/script>' index.html
          ! grep -q 'Todo el procesamiento ocurre' splitter-app.html

      - name: Commit fixed loader and app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_splitter_patch.py index.html splitter-app.html
          git commit -m "Corregir cargador y publicar zoom multitáctil" || exit 0
          git pull --rebase origin main
          git push
