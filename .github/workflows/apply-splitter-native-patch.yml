name: Apply native Splitter patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-splitter-native-patch.yml
      - scripts/apply_splitter_patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch original editor
        run: python3 scripts/apply_splitter_patch.py

      - name: Verify patch markers
        run: |
          grep -q 'SPLITTER_NATIVE_PATCH_V2' splitter-app.html
          grep -q 'SPLITTER_NATIVE_INTERACTION_V2' splitter-app.html
          grep -q 'SPLITTER_SCISSORS_TOOLBAR_V2' splitter-app.html
          ! grep -q 'Todo el procesamiento ocurre' splitter-app.html

      - name: Commit native patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html splitter-app.html
          git commit -m "Integrar zoom y tijeras dentro de Splitter MP3" || exit 0
          git pull --rebase origin main
          git push
